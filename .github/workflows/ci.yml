# Checks every pull request to main must pass before it can merge (see the main ruleset).
# Actions are pinned to commit SHAs; Dependabot keeps them current. The workflow token is read-only.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Script tests (no network, no key)
        run: python -m unittest discover -s tests -v

      - name: Report arithmetic tests (calc.js)
        run: node --test tests/calc.test.mjs

      - name: Skill and plugin manifests
        run: python tests/check_manifests.py
